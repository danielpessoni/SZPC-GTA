<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana do Zero ao Programador Contratado - Landing Page GTA</title>
    <link rel="shortcut icon" href="src/imagens/favicon.png" type="image/x-icon">
    <link href="https://fonts.cdnfonts.com/css/chalet" rel="stylesheet">
    <link rel="stylesheet" href="src/css/variaveis.css">
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/estilo.css">
    <link rel="stylesheet" href="src/css/responsivo.css">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="src/imagens/logo-rockstar.svg" alt="Logo Rockstar Games">
            <hr>
            <img src="src/imagens/logo-gta.svg" alt="Logo GTA V">
        </div>

        <nav aria-label="Menu principal">
            <ul class="menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#comprar">Comprar</a></li>
                <li>
                    <a href="https://support.rockstargames.com/categories/20013306"
                       target="_blank"
                       rel="noopener noreferrer">
                        Suporte
                        <img src="src/imagens/icone-link.svg" alt="Ícone indicando link externo">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="home" id="home">
            <img class="imagem-fundo" src="src/imagens/bg-main.png" alt="Rapaz de moletom laranja ao lado de um carro esportivo amarelo">

            <div class="informacoes">
                <div class="lista-de-jogos">
                    <img src="src/imagens/logo-gta-v.svg" alt="Logo GTA V">
                    <img src="src/imagens/logo-gta-online.svg" alt="Logo GTA Online">
                </div>

                <h1 class="titulo">
                    Já disponíveis para Playstation 5 e Xbox Series X|S
                </h1>

                <p class="texto">
                    Experimente os fenômenos de entretenimento Grand Theft Auto V e GTA Online.
                </p>

                <a class="btn-comprar" href="#comprar">
                    Compre já
                </a>
            </div>
        </section>

        <section class="compre-ja" id="comprar">
            <h2 class="titulo">Compre já</h2>

            <article class="cartao">
                <img class="capa-do-jogo" src="src/imagens/gta5.jpg" alt="Capa do jogo Grand Theft Auto V" loading="lazy">

                <div class="informacoes">
                    <h3>Grand Theft Auto V</h3>

                    <p>
                        Inclui <strong>Modo História do GTA V</strong> e
                        <strong>GTA Online</strong>.
                    </p>

                    <ul class="plataformas">
                        <li>
                            <img src="src/imagens/logo-ps5.svg" alt="Logo PlayStation 5" loading="lazy">
                        </li>
                        <li>
                            <img src="src/imagens/logo-xbox-series-s.svg" alt="Logo Xbox Series X|S" loading="lazy">
                        </li>
                        <li>
                            <img src="src/imagens/logo-ps4.svg" alt="Logo PlayStation 4" loading="lazy">
                        </li>
                        <li>
                            <img src="src/imagens/logo-xbox-one.svg" alt="Logo Xbox One" loading="lazy">
                        </li>
                        <li>
                            <img src="src/imagens/logo-pc.svg" alt="Logo PC" loading="lazy">
                        </li>
                    </ul>
                </div>

                <button type="button" class="btn-plataforma" aria-expanded="false" aria-controls="lista-plataformas">
                    Selecione a plataforma

                    <ul class="plataformas" id="lista-plataformas">
                        <li>
                            <img src="src/imagens/logo-ps5.svg" alt="Logo PlayStation 5">
                        </li>
                        <li>
                            <img src="src/imagens/logo-xbox-series-s.svg" alt="Logo Xbox Series X|S">
                        </li>
                        <li>
                            <img src="src/imagens/logo-ps4.svg" alt="Logo PlayStation 4">
                        </li>
                        <li>
                            <img src="src/imagens/logo-xbox-one.svg" alt="Logo Xbox One">
                        </li>
                        <li>
                            <img src="src/imagens/logo-pc.svg" alt="Logo PC">
                        </li>
                    </ul>
                </button>
            </article>
        </section>

    </main>

    <script src="src/js/index.js" defer></script>
</body>

</html>
